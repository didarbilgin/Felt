services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-felt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-felt}
      POSTGRES_DB: ${POSTGRES_DB:-felt}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-felt} -d ${POSTGRES_DB:-felt}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18000:8000"
    volumes:
      - ./backend:/app

  web:
    image: node:20-alpine
    working_dir: /app
    depends_on:
      - api
    ports:
      - "18080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 8080"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@felt.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data: